{% extends 'base.html' %}
{% block titulo %}Mi Perfil - JERDD{% endblock %}

{% block contenido %}
<h2 class="fw-bold mb-4"><i class="bi bi-person-circle"></i> Mi Perfil</h2>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Datos personales</h5>
                <form method="POST">
                    <input type="hidden" name="accion" value="datos">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="nombre" class="form-control rounded-3" value="{{ usuario.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control rounded-3 bg-light" value="{{ usuario.email }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control rounded-3" value="{{ usuario.telefono or '' }}" placeholder="+57 300 000 0000">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" name="direccion" class="form-control rounded-3" value="{{ usuario.direccion or '' }}" placeholder="Calle, número, ciudad">
                    </div>
                    <button type="submit" class="btn btn-primary rounded-3">Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Cambiar contraseña</h5>
                <form method="POST">
                    <input type="hidden" name="accion" value="contrasena">
                    <div class="mb-3">
                        <label class="form-label">Contraseña actual</label>
                        <input type="password" name="contrasena_actual" class="form-control rounded-3" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nueva contraseña</label>
                        <input type="password" name="contrasena_nueva" class="form-control rounded-3" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar nueva contraseña</label>
                        <input type="password" name="contrasena_nueva2" class="form-control rounded-3" required>
                    </div>
                    <button type="submit" class="btn btn-warning rounded-3">Cambiar contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
