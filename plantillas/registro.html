<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - JERDD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width:56px;height:56px;font-size:1.5rem;font-weight:700">J</div>
                        <h2 class="fw-bold mb-1">Crear cuenta</h2>
                        <p class="text-muted small">Regístrate en JERDD</p>
                    </div>

                    {% with msgs = get_flashed_messages(with_categories=true) %}
                    {% for cat, msg in msgs %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                    {% endfor %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Nombre completo <span class="text-danger">*</span></label>
                            <input type="text" name="nombre" class="form-control rounded-3" placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Correo electrónico <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control rounded-3" placeholder="tu@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Contraseña <span class="text-danger">*</span></label>
                            <input type="password" name="contrasena" class="form-control rounded-3" placeholder="Mínimo 6 caracteres" required minlength="6">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Confirmar contraseña <span class="text-danger">*</span></label>
                            <input type="password" name="contrasena2" class="form-control rounded-3" placeholder="Repite la contraseña" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-3 fw-medium">Crear cuenta</button>
                    </form>

                    <hr class="my-3">
                    <p class="text-center mb-0 small">¿Ya tienes cuenta?
                        <a href="{{ url_for('autenticacion.login') }}" class="fw-medium">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
