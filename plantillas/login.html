<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JERDD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center mb-3" style="width:56px;height:56px;font-size:1.5rem;font-weight:700">J</div>
                        <h2 class="fw-bold mb-1">JERDD</h2>
                        <p class="text-muted small">Sistema de Gestión Comercial</p>
                    </div>

                    {% with msgs = get_flashed_messages(with_categories=true) %}
                    {% for cat, msg in msgs %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                    {% endfor %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-medium">Correo electrónico</label>
                            <input type="email" name="email" class="form-control rounded-3" placeholder="tu@email.com" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">Contraseña</label>
                            <input type="password" name="contrasena" class="form-control rounded-3" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-3 fw-medium">Ingresar</button>
                    </form>

                    <hr class="my-3">
                    <p class="text-center mb-0 small">¿No tienes cuenta?
                        <a href="{{ url_for('autenticacion.registro') }}" class="fw-medium">Regístrate</a>
                    </p>

                    <div class="mt-3 p-3 bg-light rounded-3">
                        <p class="small text-muted mb-1 fw-medium">Accesos de prueba:</p>
                        <p class="small text-muted mb-0">Admin: admin@jerdd.com / admin123</p>
                        <p class="small text-muted mb-0">Cliente: juan@test.com / cliente123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
